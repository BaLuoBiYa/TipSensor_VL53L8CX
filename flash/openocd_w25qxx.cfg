# OpenOCD Configuration – STM32G031F8 + external SPI NOR Flash
#
# Supports W25Qxx, GD25Qxx and compatible families.
#
# Hardware:
#   STM32G031F8Px  (Cortex-M0+)
#   Debug probe:    ST-Link/V2 (or compatible, e.g. CMSIS-DAP)
#   SPI Flash:      SPI NOR Flash on SPI1
#       PA5 → SCK   PA6 → MISO   PA7 → MOSI   PB6 → CS
#
# Integration (two options):
#
# Option A – Include in your existing OpenOCD config:
#     source [find interface/stlink.cfg]
#     source [find target/stm32g0x.cfg]
#     source flash/openocd_w25qxx.cfg
#     init
#     reset halt
#     # Program VL53L8CX firmware image
#     flash write_image erase vl53l8cx_fw.bin 0x90000000
#     reset run
#
# Option B – Use this file standalone after sourcing your interface/target:
#     openocd -f interface/stlink.cfg -f target/stm32g0x.cfg -f flash/openocd_w25qxx.cfg
#
# Important paths are relative to the OpenOCD working directory.
# Adjust the flash loader path below if needed.
# =============================================================================

# ── External SPI Flash Bank Definition ──────────────────────────────

set _EXTFLASHNAME $_CHIPNAME.spinor

# Use 'virtual' driver with custom flash loader algorithm.
# Parameters:  driver  base       size      num_sectors  sector_size  target  work_area_base  loader_file
flash bank $_EXTFLASHNAME virtual 0x90000000 0x00100000 0 0 $_TARGETNAME 0x20000000 flash/build/flash_loader.elf

# ── Optional: speed up operations ───────────────────────────────────

# Increase JTAG/SWD speed after init
$_TARGETNAME configure -event reset-init {
    adapter speed 4000
}

# ── Helper: erase entire chip ───────────────────────────────────────

proc spinor_mass_erase {} {
    flash erase_sector 0 0 255
}

echo "=== External SPI NOR flash configured ==="
echo "Usage:  flash write_image erase <file.bin> 0x90000000"
