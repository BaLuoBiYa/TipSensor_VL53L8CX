version: "4.1"
name: FirmWare
type: ARM
deviceName: null
packDir: null
srcDirs:
  - Core
  - Drivers
virtualFolder:
  name: <virtual_root>
  files: []
  folders: []
dependenceList: []
outDir: build
miscInfo:
  uid: 72e3e2c8ac17ae7874e51b736a94236b
targets:
  Debug:
    cppPreprocessAttrs:
      defineList:
        - DEBUG
        - USE_HAL_DRIVER
        - STM32G031xx
      incList:
        - Core/Inc
        - Drivers/STM32G0xx_HAL_Driver/Inc
        - Drivers/STM32G0xx_HAL_Driver/Inc/Legacy
        - Drivers/CMSIS/Device/ST/STM32G0xx/Include
        - Drivers/CMSIS/Include
        - Drivers/BSP/VL53L8CX_ULD_API/inc
      libList: []
    excludeList: []
    settings: {}
    toolchain: GCC
    toolchainConfigMap:
      GCC:
        archExtensions: ""
        cpuType: Cortex-M0+
        floatingPointHardware: none
        options:
          version: 5
          afterBuildTasks: []
          asm-compiler:
            ASM_FLAGS: -DDEBUG
          beforeBuildTasks: []
          c/cpp-compiler:
            CXX_FLAGS: ""
            C_FLAGS: ""
            language-c: c11
            language-cpp: c++11
            one-elf-section-per-data: true
            one-elf-section-per-function: true
            optimization: level-debug
            warnings: all-warnings
          global:
            $float-abi-type: hard
            misc-control: []
            not-use-syscalls: true
            output-debug-info: enable
            use-newlib-nano: true
          linker:
            $outputTaskExcludes:
              - .bin
            LD_FLAGS: ""
            LIB_FLAGS: ""
            output-format: elf
            remove-unused-input-sections: true
        scatterFilePath: STM32G031F8PX_FLASH.ld
        storageLayout:
          RAM: []
          ROM: []
        useCustomScatterFile: true
    uploadConfigMap:
      JLink:
        baseAddr: ""
        bin: ""
        cpuInfo:
          cpuName: "null"
          vendor: "null"
        otherCmds: ""
        proType: 1
        speed: 8000
      OpenOCD:
        baseAddr: "0x08000000"
        bin: ""
        interface: cmsis-dap
        target: stm32g0x
    uploader: OpenOCD
  Release:
    cppPreprocessAttrs:
      defineList:
        - USE_HAL_DRIVER
        - STM32G070xx
      incList:
        - Core/Inc
        - Drivers/STM32G0xx_HAL_Driver/Inc
        - Drivers/STM32G0xx_HAL_Driver/Inc/Legacy
